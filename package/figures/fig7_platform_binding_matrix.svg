<text x="36.0" y="399.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="start" font-weight="normal">Improved: capture-path integrity (only the compositor produces the frame); directness of surface→process.</text>
<text x="36.0" y="413.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="start" font-weight="normal">Not improved: capture→surface (portal AvailableSourceTypes = 1, MONITOR only); surface→displayed resource.</text>
<text x="36.0" y="427.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="start" font-weight="normal">Made worse: cross-client enumeration only via compositor-private IPC.</text>
<text x="20.0" y="400.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="start" font-weight="normal">Source: outputs/platform_binding_matrix.csv. Wayland arm = sway 1.7 (wlroots) headless + xdg-desktop-portal-wlr + PipeWire, software-rendered container.</text>
<text x="20.0" y="412.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="start" font-weight="normal">SCOPE: ONE compositor, ONE portal backend, TWO constructed cases. GNOME/KDE portal backends implement WINDOW sources and were NOT tested.</text>
