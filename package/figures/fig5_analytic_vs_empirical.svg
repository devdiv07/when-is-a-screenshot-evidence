<text x="36.0" y="360.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="start" font-weight="normal">In this experiment, analytic field-vector evaluation was overconfident relative to real recorder</text>
