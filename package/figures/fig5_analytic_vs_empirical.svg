<text x="36.0" y="388.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="start" font-weight="normal">every tier' — did not survive contact with a real display.</text>
<text x="36.0" y="406.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="600">This is ONE measured instance. It is not a general claim about analytic security evaluation.</text>
<text x="20.0" y="440.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="start" font-weight="normal">Source: outputs/analytic_vs_empirical.csv (13 scenarios x 13 tier configurations).</text>
<text x="20.0" y="452.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="start" font-weight="normal">SCOPE: one experiment, one contract, a constructed 13-scenario suite. Not a general result about analytic evaluation.</text>
