[project]
name = "scene-provenance-lab"
version = "0.0.1"
description = "Evidence-first visual scene provenance research for hybrid agent traces"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=2.0",
  "scipy>=1.14",
  "requests>=2.32",
  "pydantic>=2.9",
  "networkx>=3.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
