# Minimal sway config for the headless provenance lab.
# No terminal, no bar, no keybindings that could open anything: the only surfaces on
# this compositor are the ones a case deliberately creates.

output HEADLESS-1 resolution 1280x1024 position 0,0

default_border none
default_floating_border none
titlebar_padding 1
focus_follows_mouse no

# XWayland must stay ENABLED: whether a given app is native Wayland or XWayland is one
# of the things this experiment measures, so it must be possible for an app to be either.
xwayland enable

# Tiling would resize case surfaces unpredictably; float everything and let the case
# script place it, so geometry is a property of the case and not of a layout algorithm.
for_window [title=".*"] floating enable
